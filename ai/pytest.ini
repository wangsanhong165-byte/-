[pytest]
testpaths = tests
# Keep pytest runtime artifacts outside the repository. Default --basetemp
# already lives under the OS temp dir; move the cache plugin there too so
# interrupted runs cannot leave locked .pytest-* directories in the repo.
cache_dir = %TEMP%/soullink-pytest-cache
norecursedirs =
    .git
    .pytest_cache
    .venv
    venv
    node_modules
    site-packages
    olv_extracted
    Open-LLM-VTuber-1.2.1
